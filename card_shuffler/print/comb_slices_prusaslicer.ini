# PrusaSlicer settings for the comb slices (slice_00 ... slice_17).
# Load with:  prusa-slicer --load print/comb_slices_prusaslicer.ini ...
# or import it in the GUI (File > Import > Import Config).
#
# Why these matter:
#  - 0.1 mm layers: each blade thickens one layer at a time; every layer is a
#    small ledge on the wall cards slide down, and 0.2 mm ledges caught cards.
#  - 0.15 mm first layer: the top of each blade is a 0.15 mm film, printed as
#    the first layer on the bed.  Set the first layer height carefully: the
#    design tolerates 0.1 to 0.2 mm, but a 0.25 mm film is too stiff.
#  - 0.6 mm minimum solid shells: with the default three solid layers (only
#    0.3 mm at this layer height) the middle of each 1 mm blade is printed as
#    sparse infill.
layer_height = 0.1
first_layer_height = 0.15
perimeters = 3
top_solid_min_thickness = 0.6
bottom_solid_min_thickness = 0.6
fill_density = 15%
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
